name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Image
      run: |
        docker build -t vesahadergjonaj/my-cicd-demo:${{ github.sha }} .

    - name: Push Image
      run: |
        docker push vesahadergjonaj/my-cicd-demo:${{ github.sha }}

    - name: Setup kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

    - name: Update Deployment
      run: |
        kubectl set image deployment/my-cicd-demo \
        my-cicd-demo=vesahadergjonaj/my-cicd-demo:${{ github.sha }}